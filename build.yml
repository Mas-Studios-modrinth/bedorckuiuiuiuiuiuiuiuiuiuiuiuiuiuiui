name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Uses ./gradlew when the wrapper has been committed, otherwise installs Gradle itself.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ hashFiles('gradlew') == '' && '9.2.0' || '' }}

      - name: Build
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew build --stacktrace
          else gradle build --stacktrace; fi

      - name: Verify jar contents
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q 'BedrockUiClient.class' || { echo "::error::No compiled classes in jar. Is src/ in the repo root next to build.gradle?"; exit 1; }
          unzip -l "$JAR" | grep -q 'fabric.mod.json' || { echo "::error::fabric.mod.json missing from jar"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-ui
          path: build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bedrock-ui
          path: libs
      - uses: softprops/action-gh-release@v2
        with:
          files: libs/*.jar
          generate_release_notes: true
